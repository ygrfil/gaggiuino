; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = extra_defines.ini
default_envs = all-pcb-stlink

[extra]
build_flags =
	;placeholder values, create a untracked extra_defines.ini file
	;in the project root directory(same level as platformio.ini)
	;so you can keep your custom setup defined by default on every pull
	; -DDREAM_STEAM_DISABLED

[env]
check_tool = clangtidy, cppcheck
check_skip_packages = yes
check_flags =
	clangtidy: --checks=-*,cert-*,clang-analyzer-* --fix
	cppcheck: --enable=all --std=c++11 --suppress=*:*/.pio/* --suppress=*:*/lib/* --suppress=missingIncludeSystem --suppress=unmatchedSuppression --suppress=missingInclude --suppress=unusedFunction
platform_packages = tool-cppcheck@1.260.0

[env:all-pcb-stlink]
extends = blackpill-core
lib_deps =
	${blackpill-core.lib_deps}
	adafruit/Adafruit MAX31855 library@1.4.2
build_type = release

[blackpill-core]
framework = arduino
platform = ststm32@19.5.0
board = blackpill_f411ce
extra_scripts =
	pre:scripts/auto-version.py
	pre:scripts/custom-src-dir.py
custom_src_dir = src
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
lib_compat_mode = strict
lib_deps =
	robtillaart/ADS1X15@0.3.7
	khoih-prog/FlashStorage_STM32@1.2.0
	powerbroker2/SerialTransfer@^3.1.5
	https://github.com/denyssene/SimpleKalmanFilter.git#fc29b517874b40f9bd8f802f3cb2579ccc651855
	https://github.com/Zer0-bit/EasyNextionLibrary.git#1272a6de37f8aec60bd28941e2d96dc5f5613d0b
	https://github.com/banoz/PSM.Library.git#8a920d66b497873a4f001b62c295bbadb624682a
	https://github.com/kc9zda/NCP5623.git#962798c0c48bf94a6e8e08666033e4f81f6ad524
	https://github.com/Zer0-bit/Adafruit_VL53L0X.git#0aff489dd34821318faf297a09956edf60c31151
	https://github.com/JChristensen/movingAvg.git#63dfeb53e0ea8255b47f582efdd37eb029bb043d
	https://github.com/SomeLucky1/PCA9632.git#8cc2bc795d15a09a99585d2f1666b92aa7da7698
build_flags =
	-DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-DUSBCON
	-DLOG_LEVEL=3
	-DSINGLE_BOARD
	-DPCBV2
	; -DDEBUG_ENABLED
	${extra.build_flags}
	-DPIO_FRAMEWORK_ARDUINO_STANDARD_LIB
	-DENABLE_HWSERIAL2
	-DPIN_SERIAL2_RX=PA3
	-DPIN_SERIAL2_TX=PA2
	-DPIN_SERIAL1_RX=PA10
	-DPIN_SERIAL1_TX=PA9
	-DSERIAL_TX_BUFFER_SIZE=256
	-DSERIAL_RX_BUFFER_SIZE=256
	-DBEAUTIFY_GRAPH
	-O3
	-mfloat-abi=hard
	-mfpu=fpv4-sp-d16
build_unflags =
	-Os
build_src_flags =
	-Wdouble-promotion -Wall
build_src_filter =
	+<*>
	-<peripherals/scales.cpp>
	-<peripherals/remote_scales.cpp>
check_src_filters =
	src

[env:test]
platform = native
build_flags =
	-std=gnu++17
	-Wno-missing-template-arg-list-after-template-kw
lib_deps =
	mocks
	ArduinoFake@^0.4.0
	powerbroker2/SerialTransfer@^3.1.5
lib_extra_dirs =
	test-lib
lib_compat_mode = off
